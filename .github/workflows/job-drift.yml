name: Collect job drift
on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"
permissions:
  contents: write
concurrency:
  group: job-drift-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: npm run collect
      - run: npm run generate
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          git commit -m "data: collect job drift"
          git push
